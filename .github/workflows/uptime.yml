name: Uptime Monitoring

on:
  schedule:
    # Run every 6 hours (lightweight availability check, not keep-alive traffic)
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime-monitoring
  cancel-in-progress: true

jobs:
  check-availability:
    name: Check Production Availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout uptime check script
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/uptimeCheck.mjs

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Probe Vercel frontend and Render backend health/readiness
        run: node scripts/uptimeCheck.mjs
